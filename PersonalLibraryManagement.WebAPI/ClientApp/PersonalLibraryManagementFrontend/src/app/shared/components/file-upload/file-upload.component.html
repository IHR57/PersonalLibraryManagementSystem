<h2 mat-dialog-title>Upload File</h2>

  <!-- Dialog Content -->
  <mat-dialog-content>
    <form [formGroup]="fileForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <input 
          type="file" 
          id="fileInput" 
          (change)="onFileSelected($event)"
          class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
        />
        <mat-error *ngIf="fileForm.touched && fileForm.get('file')?.hasError('required')">
          Please select a file to upload.
        </mat-error>
        <mat-error *ngIf="fileTypeError">
          Invalid file type. Allowed types: {{ allowedFileTypes.join(', ') }}.
        </mat-error>
      </div>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-stroked-button color="secondary" (click)="closeModal()">Cancel</button>
    <button mat-stroked-button color="primary" (click)="onSubmit()" cdkFocusInitial>Upload</button>
  </mat-dialog-actions>
